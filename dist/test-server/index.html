<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>로그인 · CVML Workspace</title>
  <style>
    *{box-sizing:border-box}
    html{-webkit-text-size-adjust:100%}
    body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
    main{min-height:100vh;min-height:100svh;display:grid;grid-template-columns:minmax(0,1fr);place-items:center;padding:28px 16px}
    .entry{width:min(100%,420px);padding:clamp(28px,7vw,44px) clamp(20px,6vw,36px);background:#fff;border:1px solid #e8e8ed;border-radius:26px;box-shadow:0 10px 40px #20203208}
    .entry-brand{margin:0 0 14px;color:#6e6e73;font-size:11px;font-weight:650;letter-spacing:.16em}
    h1{margin:0;font-size:clamp(28px,7vw,36px);line-height:1.15;letter-spacing:-.05em}
    .entry-version{margin:8px 0 26px;color:#6e6e73;font-size:14px}
    .entry-form{display:grid;gap:8px}
    .entry-form label{font-size:13px;font-weight:600}
    .entry-form input[type=text],.entry-form input[type=password]{width:100%;min-height:46px;margin-bottom:10px;padding:11px 13px;border:1px solid #d2d2d7;border-radius:12px;background:#fff;color:inherit;font:inherit;font-size:16px}
    .entry-form input[aria-invalid=true]{border-color:#c9342b}
    .entry-form input:disabled{background:#f5f5f7}
    .entry-remember{display:flex;align-items:center;gap:9px;min-height:40px;margin:-2px 0 6px;color:#48484d;font-weight:500!important;cursor:pointer}
    .entry-remember input{width:18px;height:18px;margin:0;accent-color:#0071e3}
    .entry-form button{min-height:48px;border:0;border-radius:999px;background:#0071e3;color:#fff;font:inherit;font-size:15px;font-weight:600;cursor:pointer}
    .entry-form button:hover{background:#0067d0}
    .entry-form button:disabled{opacity:.55;cursor:default}
    .entry-error{min-height:20px;margin:4px 0 0;color:#b3261e;font-size:13px;line-height:1.5}
    .entry-help{margin:18px 0 0;padding-top:18px;border-top:1px solid #e8e8ed;color:#6e6e73;font-size:13px;line-height:1.65;word-break:keep-all}
    .entry-home{display:inline-block;margin-top:14px;padding:6px 0;color:#0066cc;font-size:14px;font-weight:550;text-decoration:none}
    .entry-home:hover{text-decoration:underline}
    a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid #0071e3;outline-offset:3px}
    @media (prefers-reduced-motion:no-preference){.entry-form button{transition:background-color .15s}}
  </style>
</head>
<body>
  <main>
    <section class="entry" aria-labelledby="entry-title">
      <p class="entry-brand">CVML · TEST SERVER</p>
      <h1 id="entry-title">CVML Workspace</h1>
      <p class="entry-version">v3.0 snapshot 3</p>
      <form id="workspace-login" class="entry-form" novalidate>
        <label for="workspace-name">이름</label>
        <input id="workspace-name" name="username" type="text" maxlength="40" autocomplete="username" spellcheck="false" placeholder="예: 홍길동" required disabled>
        <label for="workspace-password">비밀번호</label>
        <input id="workspace-password" name="password" type="password" maxlength="200" autocomplete="current-password" required aria-describedby="workspace-error" disabled>
        <label class="entry-remember" for="workspace-remember"><input id="workspace-remember" type="checkbox" disabled>이 브라우저에서 30일 동안 로그인 유지</label>
        <button type="submit" disabled>로그인</button>
        <p id="workspace-error" class="entry-error" role="alert"></p>
        <noscript><p class="entry-error">로그인하려면 자바스크립트를 켜 주세요.</p></noscript>
      </form>
      <p class="entry-help">연구실 구성원을 위한 화면이에요. 이름은 기록을 남긴 사람을 표시하는 데 쓰이고, 비밀번호는 연구실 관리자에게 문의해 주세요.</p>
      <a class="entry-home" href="../">정식 화면 보기</a>
    </section>
  </main>
  <script type="module" src="./access.js?v=workspace-3a"></script>
</body>
</html>
