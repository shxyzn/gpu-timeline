<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>테스트 운영 종료 · CVML GPU Timeline</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;-webkit-font-smoothing:antialiased}
    main{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:28px 20px}
    .notice{width:min(100%,560px);padding:clamp(32px,8vw,56px) 24px;text-align:center;background:#fff;border:1px solid #e8e8ed;border-radius:26px;box-shadow:0 10px 40px #20203208}
    .brand{margin:0 0 16px;color:#727278;font-size:11px;font-weight:650;letter-spacing:.17em}
    h1{margin:0;font-size:clamp(27px,6vw,42px);line-height:1.2;letter-spacing:-.055em;word-break:keep-all}
    .message{margin:17px 0 28px;color:#69696f;font-size:15px;line-height:1.7;word-break:keep-all}
    a{display:inline-block;padding:12px 22px;border-radius:999px;background:#1d1d1f;color:#fff;font-size:14px;font-weight:550;text-decoration:none}
    a:hover{background:#424247}a:focus-visible{outline:2px solid #0071e3;outline-offset:4px}
  </style>
</head>
<body>
  <main>
    <section class="notice" aria-labelledby="title">
      <p class="brand">CVML GPU TIMELINE</p>
      <h1 id="title">테스트 운영 종료</h1>
      <p class="message">테스트한 기능은 정식 대시보드에서 이용할 수 있어요.</p>
      <a href="../">정식 화면 보기</a>
    </section>
  </main>
</body>
</html>
