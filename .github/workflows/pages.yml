name: Publish GPU Timeline
on:
  push:
    branches: [main]
    paths: ['dist/**', 'scripts/*promo*', 'VERSION', 'agent/version_info.py', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-22.04
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Stamp dashboard version
        run: python3 agent/version_info.py --output dist/version.json
      - name: Reuse unchanged release films
        uses: actions/cache@v4
        id: promo-cache
        with:
          path: |
            dist/media
            /tmp/gpu-timeline-promo
          key: promo-v21-${{ runner.os }}-${{ hashFiles('scripts/*promo*') }}
      - name: Render and verify release media
        if: steps.promo-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python3 -m pip install -r scripts/promo-requirements.txt
          bash scripts/build_promo.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          name: ${{ env.PAGES_ARTIFACT }}
      - name: Wait for uploaded artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const {data} = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId, name: process.env.PAGES_ARTIFACT
              });
              if (data.artifacts.filter(a => a.name === process.env.PAGES_ARTIFACT && !a.expired).length === 1) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('The uploaded Pages artifact is not visible in the API yet.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT }}
