name: Check collector and shared access
on:
  push:
    branches: [main]
    paths: ['agent/**', 'scripts/**', 'tests/**', 'dist/**', 'VERSION', 'package*.json', '.github/workflows/checks.yml']
  pull_request:
    paths: ['agent/**', 'scripts/**', 'tests/**', 'dist/**', 'VERSION', 'package*.json', '.github/workflows/checks.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.8', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Collector, compatibility and Unix socket checks
        env:
          GPU_TIMELINE_REQUIRE_SOCKET_TESTS: '1'
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Real separate-account authorization check
        if: matrix.python == '3.11'
        run: sudo env GPU_TIMELINE_REQUIRE_SOCKET_TESTS=1 "$(command -v python)" -m unittest discover -s tests -p 'test_shared.py' -v
      - name: Install and migrate on a disposable server
        if: matrix.python == '3.11'
        run: sudo env GITHUB_ACTIONS=true bash tests/ci_shared_install.sh "$(command -v python)"
      - name: CLI and installer syntax
        run: |
          bash -n agent/install-shared.sh
          python agent/shared_cli.py add --help
          python agent/shared_cli.py run --help
          python agent/version_info.py --output /tmp/gpu-timeline-build.json
          python -c "import json; d=json.load(open('/tmp/gpu-timeline-build.json')); assert len(d['revision']) == 40; assert d['dirty'] is False"
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Dashboard behavior
        run: |
          node --check dist/app.js
          node --check dist/model.js
          node --check dist/admin.js
          node --check dist/edits.js
          npm test
      - name: Render and verify release media
        if: matrix.python == '3.11'
        timeout-minutes: 10
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-cjk
          python3 -m pip install -r scripts/promo-requirements.txt
          bash scripts/build_promo.sh
      - name: Browser editor workflow (mock GitHub; no real writes)
        if: matrix.python == '3.11'
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run test:browser
      - name: Dashboard screenshots
        if: always() && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-screenshots
          path: /tmp/gpu-timeline-browser/*.png
          retention-days: 7
      - name: Release film and storyboard
        if: always() && matrix.python == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: release-promo-60s
          path: |
            dist/media/*v1.1.8*
            dist/media/*v1.2.0*
            /tmp/gpu-timeline-promo/*.png
          retention-days: 7
